<svg xmlns="http://www.w3.org/2000/svg" width="550" height="500" viewBox="0 0 550 500" role="img"><title>switch: one T1 stops forwarding, BGP and BFD stay up</title><rect x="0" y="0" width="550" height="500" rx="12" fill="#FFFFFF"/><g style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><text x="275" y="28" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">switch - one T1 stops forwarding, BGP and BFD stay up</text><rect x="20" y="42" width="510" height="190" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 4"/><text x="36" y="66" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start">rail - BGP + BFD, per-flow ECMP</text><line x1="100" y1="132" x2="120" y2="132" stroke="#1D9E75" stroke-width="1.5"/><line x1="200" y1="126" x2="230" y2="102" stroke="#1D9E75" stroke-width="1.5"/><line x1="200" y1="138" x2="230" y2="162" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="290" y1="102" x2="320" y2="126" stroke="#1D9E75" stroke-width="1.5"/><line x1="290" y1="162" x2="320" y2="138" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="400" y1="132" x2="420" y2="132" stroke="#1D9E75" stroke-width="1.5"/><rect x="40" y="114" width="60" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="70.0" y="137.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">srv1</text><rect x="120" y="114" width="80" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="160.0" y="137.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">leaf-a0</text><rect x="230" y="84" width="60" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="260.0" y="107.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">s1</text><rect x="230" y="144" width="60" height="36" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.6"/><text x="260.0" y="167.0" font-size="14" f