<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>mrc-style app logic</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1080" height="590" rx="12" fill="#FFFFFF"/><text x="540.0" y="32" font-size="16" fill="#2C2C2A" font-weight="500" text-anchor="middle" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mrc-style: what the Python app does in place of the MRC NIC</text><rect x="20" y="56" width="560" height="420" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="4 4"/><text x="34" y="78" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">srv1 - sender (tools/flows.py send)</text><rect x="40" y="92" width="300" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="52" y="113" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">32 QPs, 1000 packets per second each</text><line x1="190" y1="138" x2="190" y2="160" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="162" width="300" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text x="52" y="183" font-size="13" fill="#085041" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">every packet: next live path</text><text x="52" y="203" font-size="12" fill="#085041" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">round-robin over the paths still up</text><line x1="190" y1="226" x2="190" y2="248" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><text x="40" y="266" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">16 paths = 16 sockets, socket k has fwmark 100 + k</text><rect x="40.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="58.5" y="276" width="15" height="22" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.7"/><rect x="77.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="95.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="114.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="132.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="151.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="169.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="188.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="206.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="225.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="243.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="262.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="280.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="299.0" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><rect x="317.5" y="276" width="15" height="22" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text x="40" y="316" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">path 1 (red) is out: no packets until its probes answer again</text><line x1="190" y1="324" x2="190" y2="346" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="348" width="520" height="100" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="52" y="369" font-size="13" fill="#3C3489" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Linux on srv1: fwmark -&gt; own route table -&gt; SRv6 encap</text><text x="52" y="389" font-size="12" fill="#3C3489" font-weight="400" text-anchor="start" style="font-family:DejaVu Sans Mono,Menlo,Consolas,monospace">table 101:  fc00::2  encap seg6 encap.red</text><text x="52" y="406" font-size="12" fill="#3C3489" font-weight="400" text-anchor="start" style="font-family:DejaVu Sans Mono,Menlo,Consolas,monospace">segs fcbb:bb00:a00:d00:b00:e002::  dev eth1</text><text x="52" y="423" font-size="12" fill="#3C3489" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the whole path sits in the outer destination address</text><rect x="370" y="92" width="190" height="118" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/><text x="382" y="113" font-size="13" fill="#633806" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">probe loop</text><text x="382" y="133" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">every 50 ms one probe</text><text x="382" y="150" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">on each of the 16 paths</text><text x="382" y="167" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">3 unanswered in a row: out</text><text x="382" y="184" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">10 answered in a row: in</text><line x1="465" y1="210" x2="342" y2="284" stroke="#BA7517" stroke-width="1.2" marker-end="url(#a)"/><rect x="600" y="56" width="150" height="420" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="4 4"/><text x="614" y="78" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fabric</text><rect x="612" y="170" width="126" height="190" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="624" y="191" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">8 planes</text><text x="624" y="211" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">2 T1 each</text><text x="624" y="228" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">= 16 paths</text><text x="624" y="245" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif"></text><text x="624" y="262" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">static routes</text><text x="624" y="279" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+ uN SID</text><text x="624" y="296" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no routing</text><text x="624" y="313" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">protocol</text><line x1="560" y1="398" x2="610" y2="330" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="740" y1="190" x2="788" y2="140" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="770" y="56" width="290" height="420" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="4 4"/><text x="784" y="78" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">srv2 - receiver (flows.py recv)</text><rect x="790" y="92" width="250" height="82" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="802" y="113" font-size="13" fill="#3C3489" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Linux: End.DT6</text><text x="802" y="133" font-size="12" fill="#3C3489" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">unwrap, inner packet</text><text x="802" y="150" font-size="12" fill="#3C3489" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">to fc00::2</text><line x1="915" y1="174" x2="915" y2="196" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="790" y="198" width="250" height="82" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text x="802" y="219" font-size="13" fill="#085041" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">count per QP</text><text x="802" y="239" font-size="12" fill="#085041" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">which sequence numbers</text><text x="802" y="256" font-size="12" fill="#085041" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">arrived</text><rect x="790" y="320" width="250" height="100" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/><text x="802" y="341" font-size="13" fill="#633806" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">probe echo</text><text x="802" y="361" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">send each probe back</text><text x="802" y="378" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">on the same path number,</text><text x="802" y="395" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">so a probe tests both</text><text x="802" y="412" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">directions of one path</text><path d="M915 420 V452 H570 V150 H562" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="800" y="446" font-size="11" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">answers go back to the probe loop</text><rect x="20" y="494" width="520" height="76" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="32" y="515" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">real MRC</text><text x="32" y="535" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">all of this in NIC hardware, a lost packet retires</text><text x="32" y="552" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">its path within tens of microseconds</text><rect x="560" y="494" width="500" height="76" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/><text x="572" y="515" font-size="13" fill="#633806" font-weight="500" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">here</text><text x="572" y="535" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Python + Linux routes, probes every 50 ms,</text><text x="572" y="552" font-size="12" fill="#633806" font-weight="400" text-anchor="start" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">a dead path costs ~190 ms until it is out</text></svg>
