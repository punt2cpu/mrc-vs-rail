<svg xmlns="http://www.w3.org/2000/svg" width="550" height="500" viewBox="0 0 550 500" role="img"><title>Topologies</title><rect x="0" y="0" width="550" height="500" rx="12" fill="#FFFFFF"/><g style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><text x="275" y="28" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">Two labs, same hosts: 2 servers with 8 links each, 32 fabric links</text><rect x="20" y="42" width="510" height="200" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="4 4"/><text x="36" y="66" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start">rail - 18 switches, FRR with eBGP unnumbered + BFD</text><rect x="170" y="80" width="70" height="32" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="205.0" y="101.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">s1</text><rect x="310" y="80" width="70" height="32" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="345.0" y="101.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">s2</text><rect x="40" y="134" width="80" height="30" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="80.0" y="154.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">leaf-a0</text><text x="130" y="152" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">...</text><rect x="165" y="134" width="80" height="30" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="205.0" y="154.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">leaf-a7</text><rect x="300" y="134" width="80" height="30" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="340.0" y="154.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">leaf-b0</text><text x="390" y="152" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">...</text><rect x="425" y="134" width="80" height="30" rx="4"