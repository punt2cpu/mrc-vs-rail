 x="340" y="362" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle">...</text><text x="36" y="434" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start">every plane: 2 T1 (c, d) and 2 T0 (a = srv1 side, b = srv2 side)</text><text x="36" y="450" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start">srv1 eth1..eth8 go to plane 0..7, so does srv2</text><text x="36" y="466" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start">path in the address: block | src T0 | T1 | dst T0 | dst port</text></g></svg>
