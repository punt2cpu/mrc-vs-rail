# t0a-p1 - mrc lab, T0, srv1 side, plane 1
# generated by gen.py from labs/mrc/t0a-p1.*

## Links

eth1   -> t1c-p1 eth1
eth2   -> t1d-p1 eth1
eth3   -> srv1 eth2

## FRR (loaded with vtysh -f)

hostname t0a-p1
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:4::1/64
exit
!
interface eth2
 ipv6 address fd00:f:5::1/64
exit
!
interface eth3
 ipv6 address fd00:e1:1::1/64
exit
!
ipv6 route fcbb:bb00:c01::/48 fd00:f:4::2 eth1
ipv6 route fcbb:bb00:d01::/48 fd00:f:5::2 eth2
ipv6 route fcbb:bb00:e001::/48 fd00:e1:1::2 eth3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:a01::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:a01::/48 locator MAIN behavior uN
  exit
 exit
exit

## Linux (runs when the container starts)

for f in /proc/sys/net/ipv6/conf/*/disable_ipv6; do echo 0 > $f; done
for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 0 > $f; done
sysctl -qw net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1 net.ipv6.conf.all.seg6_enabled=1
sysctl -qw net.ipv4.fib_multipath_hash_policy=1 net.ipv6.fib_multipath_hash_policy=1
sysctl -qw net.ipv6.conf.all.keep_addr_on_down=1
ip link add sr0 type dummy
ip link set sr0 up
for d in zebra staticd; do
  until vtysh -c 'show daemons' 2>/dev/null | grep -qw $d; do sleep 0.5; done
done
vtysh -f /frr.conf
