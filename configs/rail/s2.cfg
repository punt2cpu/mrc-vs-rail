# s2 - rail lab, spine
# generated by gen.py from labs/rail/s2.*

## Links

eth1   -> leaf-a0 eth2
eth2   -> leaf-a1 eth2
eth3   -> leaf-a2 eth2
eth4   -> leaf-a3 eth2
eth5   -> leaf-a4 eth2
eth6   -> leaf-a5 eth2
eth7   -> leaf-a6 eth2
eth8   -> leaf-a7 eth2
eth9   -> leaf-b0 eth2
eth10  -> leaf-b1 eth2
eth11  -> leaf-b2 eth2
eth12  -> leaf-b3 eth2
eth13  -> leaf-b4 eth2
eth14  -> leaf-b5 eth2
eth15  -> leaf-b6 eth2
eth16  -> leaf-b7 eth2

## FRR (loaded with vtysh -f)

hostname s2
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
bfd
 profile fast
  receive-interval 50
  transmit-interval 50
  detect-multiplier 3
 exit
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 timers bgp 3 9
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd profile fast
 neighbor FABRIC timers connect 5
 neighbor eth1 interface peer-group FABRIC
 neighbor eth2 interface peer-group FABRIC
 neighbor eth3 interface peer-group FABRIC
 neighbor eth4 interface peer-group FABRIC
 neighbor eth5 interface peer-group FABRIC
 neighbor eth6 interface peer-group FABRIC
 neighbor eth7 interface peer-group FABRIC
 neighbor eth8 interface peer-group FABRIC
 neighbor eth9 interface peer-group FABRIC
 neighbor eth10 interface peer-group FABRIC
 neighbor eth11 interface peer-group FABRIC
 neighbor eth12 interface peer-group FABRIC
 neighbor eth13 interface peer-group FABRIC
 neighbor eth14 interface peer-group FABRIC
 neighbor eth15 interface peer-group FABRIC
 neighbor eth16 interface peer-group FABRIC
 address-family ipv4 unicast
  maximum-paths 16
 exit-address-family
exit

## Linux (runs when the container starts)

for f in /proc/sys/net/ipv6/conf/*/disable_ipv6; do echo 0 > $f; done
for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 0 > $f; done
sysctl -qw net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1 net.ipv6.conf.all.seg6_enabled=1
sysctl -qw net.ipv4.fib_multipath_hash_policy=1 net.ipv6.fib_multipath_hash_policy=1
sysctl -qw net.ipv6.conf.all.keep_addr_on_down=1
for d in zebra bgpd bfdd staticd; do
  until vtysh -c 'show daemons' 2>/dev/null | grep -qw $d; do sleep 0.5; done
done
vtysh -f /frr.conf
