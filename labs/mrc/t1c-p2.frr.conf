hostname t1c-p2
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:8::2/64
exit
!
interface eth2
 ipv6 address fd00:f:10::2/64
exit
!
ipv6 route fcbb:bb00:a02::/48 fd00:f:8::1 eth1
ipv6 route fcbb:bb00:b02::/48 fd00:f:10::1 eth2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:c02::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:c02::/48 locator MAIN behavior uN
  exit
 exit
exit
