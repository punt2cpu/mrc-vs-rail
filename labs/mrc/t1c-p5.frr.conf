hostname t1c-p5
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:20::2/64
exit
!
interface eth2
 ipv6 address fd00:f:22::2/64
exit
!
ipv6 route fcbb:bb00:a05::/48 fd00:f:20::1 eth1
ipv6 route fcbb:bb00:b05::/48 fd00:f:22::1 eth2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:c05::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:c05::/48 locator MAIN behavior uN
  exit
 exit
exit
