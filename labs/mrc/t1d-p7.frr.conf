hostname t1d-p7
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:29::2/64
exit
!
interface eth2
 ipv6 address fd00:f:31::2/64
exit
!
ipv6 route fcbb:bb00:a07::/48 fd00:f:29::1 eth1
ipv6 route fcbb:bb00:b07::/48 fd00:f:31::1 eth2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:d07::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:d07::/48 locator MAIN behavior uN
  exit
 exit
exit
