hostname t0b-p4
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:18::1/64
exit
!
interface eth2
 ipv6 address fd00:f:19::1/64
exit
!
interface eth3
 ipv6 address fd00:e2:4::1/64
exit
!
ipv6 route fcbb:bb00:c04::/48 fd00:f:18::2 eth1
ipv6 route fcbb:bb00:d04::/48 fd00:f:19::2 eth2
ipv6 route fcbb:bb00:e002::/48 fd00:e2:4::2 eth3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:b04::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:b04::/48 locator MAIN behavior uN
  exit
 exit
exit
