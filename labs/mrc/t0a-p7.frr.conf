hostname t0a-p7
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:28::1/64
exit
!
interface eth2
 ipv6 address fd00:f:29::1/64
exit
!
interface eth3
 ipv6 address fd00:e1:7::1/64
exit
!
ipv6 route fcbb:bb00:c07::/48 fd00:f:28::2 eth1
ipv6 route fcbb:bb00:d07::/48 fd00:f:29::2 eth2
ipv6 route fcbb:bb00:e001::/48 fd00:e1:7::2 eth3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:a07::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:a07::/48 locator MAIN behavior uN
  exit
 exit
exit
