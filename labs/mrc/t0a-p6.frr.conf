hostname t0a-p6
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:24::1/64
exit
!
interface eth2
 ipv6 address fd00:f:25::1/64
exit
!
interface eth3
 ipv6 address fd00:e1:6::1/64
exit
!
ipv6 route fcbb:bb00:c06::/48 fd00:f:24::2 eth1
ipv6 route fcbb:bb00:d06::/48 fd00:f:25::2 eth2
ipv6 route fcbb:bb00:e001::/48 fd00:e1:6::2 eth3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:a06::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:a06::/48 locator MAIN behavior uN
  exit
 exit
exit
