hostname t0b-p3
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:14::1/64
exit
!
interface eth2
 ipv6 address fd00:f:15::1/64
exit
!
interface eth3
 ipv6 address fd00:e2:3::1/64
exit
!
ipv6 route fcbb:bb00:c03::/48 fd00:f:14::2 eth1
ipv6 route fcbb:bb00:d03::/48 fd00:f:15::2 eth2
ipv6 route fcbb:bb00:e002::/48 fd00:e2:3::2 eth3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:b03::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:b03::/48 locator MAIN behavior uN
  exit
 exit
exit
