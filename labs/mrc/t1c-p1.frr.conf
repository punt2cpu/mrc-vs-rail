hostname t1c-p1
log file /tmp/frr.log
ip forwarding
ipv6 forwarding
!
interface eth1
 ipv6 address fd00:f:4::2/64
exit
!
interface eth2
 ipv6 address fd00:f:6::2/64
exit
!
ipv6 route fcbb:bb00:a01::/48 fd00:f:4::1 eth1
ipv6 route fcbb:bb00:b01::/48 fd00:f:6::1 eth2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:c01::/48
    format usid-f3216
   exit
  exit
  static-sids
   sid fcbb:bb00:c01::/48 locator MAIN behavior uN
  exit
 exit
exit
